
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean and responsive To-Do List app to organize daily tasks.">
  <title>TaskFlow | To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app">
    <header class="app-header">
      <div class="logo">✓</div>
      <p class="eyebrow">YOUR PERSONAL PLANNER</p>
      <h1>Task<span>Flow</span></h1>
      <p class="subtitle">Small steps. Big achievements.</p>
    </header>

    <section class="task-card" aria-label="Task manager">
      <form id="task-form" class="task-form">
        <label for="task-input" class="sr-only">Enter a new task</label>
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
          maxlength="150"
          autocomplete="off"
          required
        >
        <button type="submit" class="add-btn">+ Add</button>
      </form>

      <p id="error-message" class="error" role="alert"></p>

      <div class="toolbar">
        <p id="task-count">0 tasks left</p>
        <button id="clear-completed" class="text-btn" type="button">
          Clear completed
        </button>
      </div>

      <nav class="filters" aria-label="Filter tasks">
        <button class="filter active" data-filter="all" type="button">All</button>
        <button class="filter" data-filter="active" type="button">Active</button>
        <button class="filter" data-filter="completed" type="button">
          Completed
        </button>
      </nav>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon">✦</div>
        <h2>No tasks yet</h2>
        <p>Add your first task and make today productive!</p>
      </div>

      <footer class="card-footer">
        <span>✦ One task at a time</span>
        <span>Saved automatically</span>
      </footer>
    </section>

    <p class="page-footer">Made with care by Nirali Kumari</p>
  </main>

</body>
</html>
